<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Mamy Food</title>
    <link rel="stylesheet" href="./Css/nav.css">
    <link rel="stylesheet" href="./Css/resevation.css">
    <link rel="stylesheet" href="./Css/footer.css">

</head>
<body>
    <header>
        <nav class="navbar">
          <img src="./Assets/logo1.png" alt="Mamy Food" class="logo">
          <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="reservation.html">Réservation</a></li>
            <li><a href="contact.html">Contact</a></li>

          </ul>
        </nav>
    </header>

    <main>
        <section class="reservation">
            <h2>Réserver une table</h2>
            <form class="reservation-form">
                <input type="text" placeholder="Votre nom" required>
                <input type="email" placeholder="Votre email" required>
                <input type="tel" placeholder="Téléphone" required>
                <input type="date" required>
                <input type="time" required>
                <input type="number" placeholder="Nombre de personnes" min="1" required>
                <button type="submit">Réserver</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="./Assets/logo1.png" alt="Mamy Food">
                <p>Des plats faits maison, avec amour ❤️</p>
            </div>
            <div class="footer-links">
                <h4>Liens utiles</h4>
                <ul>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#reservation">Réservation</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <h4>Suivez-nous</h4>
                <div class="social-icons">
                    <a href="#"><img src="./Assets/facebook.svg" alt="Facebook"></a>
                    <a href="#"><img src="./Assets/instagram.svg" alt="Instagram"></a>
                    <a href="#"><img src="./Assets/twitter.svg" alt="Twitter"></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Mamy Food. Tous droits réservés.</p>
        </div>
    </footer>
